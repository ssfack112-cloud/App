<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tools & Editors | Nexus Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col justify-between p-4 md:p-8">

    <!-- Top Navbar -->
    <header class="glass-panel rounded-2xl p-4 mb-10 max-w-5xl mx-auto w-full flex justify-between items-center">
        <a href="index.html" class="btn-glass px-4 py-2 rounded-xl text-sm font-medium">← Back to Home</a>
        <h1 class="text-lg md:text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">🛠️ Smart Tools Hub</h1>
    </header>

    <!-- Main Tools Grid -->
    <main class="max-w-5xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
        
        <div class="glass-panel rounded-3xl p-6 flex flex-col justify-between">
            <div>
                <div class="text-3xl mb-3">📄</div>
                <h2 class="text-lg font-bold mb-2">PDF Editor & Converter</h2>
                <p class="text-gray-400 text-sm mb-4">Merge, split, compress or convert PDF files easily.</p>
            </div>
            <button onclick="alert('PDF Editor tool loading...')" class="btn-glass w-full py-3 rounded-xl font-semibold">Open Tool</button>
        </div>

        <div class="glass-panel rounded-3xl p-6 flex flex-col justify-between">
            <div>
                <div class="text-3xl mb-3">🖼️</div>
                <h2 class="text-lg font-bold mb-2">Image Editor & Resizer</h2>
                <p class="text-gray-400 text-sm mb-4">Crop, resize, and optimize your images in seconds.</p>
            </div>
            <button onclick="alert('Image Editor tool loading...')" class="btn-glass w-full py-3 rounded-xl font-semibold">Open Tool</button>
        </div>

        <div class="glass-panel rounded-3xl p-6 flex flex-col justify-between">
            <div>
                <div class="text-3xl mb-3">🔄</div>
                <h2 class="text-lg font-bold mb-2">File Format Changer</h2>
                <p class="text-gray-400 text-sm mb-4">Convert images, docs, and audio to different formats.</p>
            </div>
            <button onclick="alert('Format Changer tool loading...')" class="btn-glass w-full py-3 rounded-xl font-semibold">Open Tool</button>
        </div>

    </main>

    <footer class="text-center text-gray-500 text-xs py-4">
        <p>© 2026 Nexus Super Hub</p>
    </footer>
</body>
</html>
