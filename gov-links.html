<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD Govt Portals | Nexus Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col justify-between p-4 md:p-8">

    <!-- Top Navbar -->
    <header class="glass-panel rounded-2xl p-4 mb-10 max-w-5xl mx-auto w-full flex justify-between items-center">
        <a href="index.html" class="btn-glass px-4 py-2 rounded-xl text-sm font-medium">← Back to Home</a>
        <h1 class="text-lg md:text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent">🇧🇩 Bangladesh Govt Links</h1>
    </header>

    <!-- Main Govt Links Grid -->
    <main class="max-w-5xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
        
        <!-- National Identity & Passport -->
        <div class="glass-panel rounded-3xl p-6 space-y-4">
            <h2 class="text-lg font-bold text-emerald-300 border-b border-white/10 pb-2">🆔 NID & Passport Services</h2>
            <div class="flex flex-col space-y-2">
                <a href="https://services.nidw.gov.bd" target="_blank" class="btn-glass p-3 rounded-xl flex justify-between items-center"><span>National ID (NID) Portal</span> <span>↗</span></a>
                <a href="https://www.epassport.gov.bd" target="_blank" class="btn-glass p-3 rounded-xl flex justify-between items-center"><span>e-Passport Application</span> <span>↗</span></a>
            </div>
        </div>

        <!-- Education & Results -->
        <div class="glass-panel rounded-3xl p-6 space-y-4">
            <h2 class="text-lg font-bold text-emerald-300 border-b border-white/10 pb-2">🎓 Education & Board Results</h2>
            <div class="flex flex-col space-y-2">
                <a href="http://www.educationboardresults.gov.bd" target="_blank" class="btn-glass p-3 rounded-xl flex justify-between items-center"><span>Education Board Result</span> <span>↗</span></a>
                <a href="http://www.nu.ac.bd" target="_blank" class="btn-glass p-3 rounded-xl flex justify-between items-center"><span>National University (NU)</span> <span>↗</span></a>
            </div>
        </div>

    </main>

    <footer class="text-center text-gray-500 text-xs py-4">
        <p>© 2026 Nexus Super Hub</p>
    </footer>
</body>
</html>
